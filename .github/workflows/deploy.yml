name: Deploy Visual Builder to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and build
        run: |
          if [ -f "src/package.json" ]; then
            cd src
          fi
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          npx vite build --base=/digital-soul-builder-pro/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ hashFiles('src/package.json') != '' && 'src/dist' || 'dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
